name: Build

on:
  push:
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test TurboCore
        run: swift test

  app-macos:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # Signing and notarization switch on once these repository secrets exist (see README).
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        # Each test in its own process, so a crash names the test instead of hiding the run.
        run: swift test --parallel
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/turbo.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Bundle
        run: ./scripts/bundle.sh
      - name: Notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # Accept the .p8 pasted as plain text (-----BEGIN PRIVATE KEY-----) or base64.
          if printf '%s' "$APPSTORE_API_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_KEY_P8_BASE64" > "$RUNNER_TEMP/AuthKey.p8"
          else
            echo "$APPSTORE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi
          xcrun notarytool submit build/Turbo.zip --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPSTORE_KEY_ID" --issuer "$APPSTORE_ISSUER_ID" --wait
          xcrun stapler staple build/Turbo.app
          (cd build && rm -f Turbo.zip && ditto -c -k --keepParent Turbo.app Turbo.zip)
          spctl --assess --type execute --verbose=2 build/Turbo.app
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: Turbo.app
          path: build/Turbo.zip
      # Every push to main refreshes a "latest build" prerelease with a stable download URL:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/Turbo.zip
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true' }}
        run: |
          if [ "$NOTARIZED" = "true" ]; then
            OPEN_NOTE="Signed and notarized by Apple: download Turbo.zip below, unzip, drag Turbo.app to Applications and open it."
          else
            OPEN_NOTE="Or download Turbo.zip below, drag Turbo.app to Applications, open it once, then System Settings → Privacy \\& Security → Open Anyway (this build isn't notarized)."
          fi
          cat > notes.md <<'NOTES'
          Built from __REF__ @ __SHA__ (build __RUN__).

          **Install or update** (paste in Terminal):

          ```sh
          curl -fsSL https://raw.githubusercontent.com/__REPO__/main/scripts/install.sh | bash
          ```

          __OPEN_NOTE__

          Already have Turbo? Settings → Updates → Update.
          NOTES
          sed -i '' -e "s|__REF__|${GITHUB_REF_NAME}|" -e "s|__SHA__|${GITHUB_SHA::7}|" -e "s|__RUN__|${GITHUB_RUN_NUMBER}|" -e "s|__REPO__|${GITHUB_REPOSITORY}|" -e "s|__OPEN_NOTE__|${OPEN_NOTE}|" notes.md

          if gh release view latest-build >/dev/null 2>&1; then
            # Stage the new zip under a temporary name first; only after it's fully uploaded
            # swap it in for Turbo.zip and move the tag. A failed upload changes nothing.
            cp build/Turbo.zip build/Turbo-next.zip
            gh release upload latest-build build/Turbo-next.zip --clobber
            NEW_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-build" --jq '.assets[] | select(.name == "Turbo-next.zip") | .id')"
            OLD_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-build" --jq '.assets[] | select(.name == "Turbo.zip") | .id')"
            if [ -n "$OLD_ID" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ID"; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$NEW_ID" -f name=Turbo.zip >/dev/null
            git tag -f latest-build "$GITHUB_SHA"
            git push -f origin refs/tags/latest-build
            gh release edit latest-build --prerelease --title "Turbo (latest build)" --notes-file notes.md
          else
            git tag -f latest-build "$GITHUB_SHA"
            git push -f origin refs/tags/latest-build
            gh release create latest-build build/Turbo.zip --prerelease --verify-tag --title "Turbo (latest build)" --notes-file notes.md
          fi
