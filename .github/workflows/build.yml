name: Build

on:
  push:
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test TurboCore
        run: swift test

  app-macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Bundle
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Turbo.app
          path: build/Turbo.zip
      # Every push to main refreshes a "latest build" prerelease with a stable download URL:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/Turbo.zip
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Built from __REF__ @ __SHA__.

          **Install** (needs the GitHub CLI, and skips the unverified-app prompt):

          ```sh
          gh api repos/__REPO__/contents/scripts/install.sh -H "Accept: application/vnd.github.raw" | bash
          ```

          Or download Turbo.zip below, drag Turbo.app to Applications, open it once, then System Settings → Privacy & Security → Open Anyway (it isn't notarized yet).
          NOTES
          sed -i '' -e "s|__REF__|${GITHUB_REF_NAME}|" -e "s|__SHA__|${GITHUB_SHA::7}|" -e "s|__REPO__|${GITHUB_REPOSITORY}|" notes.md

          # Update in place so the download never disappears, even if a later step fails.
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin refs/tags/latest-build
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build build/Turbo.zip --clobber
            gh release edit latest-build --prerelease --title "Turbo (latest build)" --notes-file notes.md
          else
            gh release create latest-build build/Turbo.zip --prerelease --verify-tag --title "Turbo (latest build)" --notes-file notes.md
          fi
